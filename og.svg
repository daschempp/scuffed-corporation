<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for og.png (the social preview card). Rebuild with the
     sips command in README.md ("Rebuilding the social preview image").
     Only og.png is deployed; this file is the editable original.
     Colors and proportions mirror styles.css: paper/ink/acid, the .frame
     rules, the .topline strip, and the hero deck with its .hl highlight. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f3ee"/>

  <!-- .frame: vertical rules only, as on the site -->
  <rect x="40" y="0" width="2" height="630" fill="#0e0e0e"/>
  <rect x="1158" y="0" width="2" height="630" fill="#0e0e0e"/>

  <!-- .topline -->
  <g font-family="SF Mono, Menlo, Monaco, monospace" font-size="17" letter-spacing="2.4" fill="#5a5a54">
    <text x="80" y="68">SCUFFEDCORPORATION.COM</text>
    <text x="1118" y="68" text-anchor="end">SELF-HOSTED · ONE ENGINEER · EST. 2026</text>
  </g>
  <rect x="42" y="103" width="1116" height="1.5" fill="#0e0e0e"/>

  <!-- brand lockup -->
  <circle cx="90" cy="158" r="10" fill="#d6ff3f" stroke="#0e0e0e" stroke-width="2.5"/>
  <text x="114" y="167" font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="-0.3" fill="#0e0e0e">Scuffed Corporation</text>
  <rect x="42" y="203" width="1116" height="1.5" fill="#0e0e0e"/>

  <!-- .eyebrow -->
  <text x="80" y="284" font-family="SF Mono, Menlo, Monaco, monospace" font-size="17"
        font-weight="600" letter-spacing="2.4" fill="#0e0e0e">↘  SELF-HOSTED SOFTWARE, ONE ENGINEER</text>

  <!-- hero deck — .hl highlight sits behind "joke" -->
  <!-- Sized to the rasterized glyph run: "joke" measures x 642–787 at this
       font size, the period begins at 798. Padding matches .hl (.12em). -->
  <rect id="hl" x="631" y="302" width="164" height="98" fill="#d6ff3f"/>
  <g font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="88" font-weight="700" letter-spacing="-1.8" fill="#0e0e0e">
    <text x="80" y="378">The name is a joke.</text>
    <text x="80" y="470">The software isn’t.</text>
  </g>

  <rect x="42" y="535" width="1116" height="1.5" fill="#0e0e0e"/>

  <!-- footer strip -->
  <g font-family="SF Mono, Menlo, Monaco, monospace" font-size="17" letter-spacing="2.4" fill="#5a5a54">
    <text x="80" y="582">SELF-HOSTED · ONE ENGINEER · YOUR DATA STAYS YOURS</text>
    <text x="1118" y="582" text-anchor="end">SCUFFED OS</text>
  </g>
</svg>
